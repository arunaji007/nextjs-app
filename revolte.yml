revolte:
  version: '1.0'
  project: instagram
  appName: postRoll
  env:
    qa:
      branch: dev
      services:
        rid_1:
          name: web-service
          type: WEB_SERVICE
          entryPoint: index.js
          specifications:
            cpu: 2
            memory: 2
            storage: 30
          properties:
            health: /health
            port: 3000
            variables:
              BASE_URL: /api/v1
              DATABASE_URL: "#{db.dbUrl}"
              DATABASE_PORT: "#{db.dbPort}"
              DATABASE_USERNAME: "#{db.dbUsername}"
              DATABASE_PASSWORD: "#{db.dbPassword}"
              DATABASE_NAME: "#{db.dbName}"
        rid_2:
          name: db
          type: DATABASE
          specifications:
            cpu: 2
            memory: 2
            storage: 30
            engine: postgres
